<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qu Code Card</title>
    <link rel="icon" type="image/x-icon" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <section class="card">
        <div class="qr-container">
            <img src="images/image-qr-code.png" class="image" alt="Qr Code">
        </div>
        <div class="text">
            <h1 class="title">Improve your front-end skills by building projects.</h1>
            <p class="description">Scan this QR code to visit FrontEnd Mentor and take your coding skills to the next level.</p>
        </div>
    </section>
</body>
